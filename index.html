<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CivicSeva — Citizen Guidance Platform for Indian Public Services</title>
    <meta name="description" content="CivicSeva — Citizen Guidance Platform for Indian Public Services. Demystifying government service procedures, verifying document readiness, and eliminating counter friction." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Gujarati:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          // Pre-render language and text direction (RTL for Urdu) to prevent FOUC / layout shift
          var lang = localStorage.getItem('civicsaathi_language') || 'en';
          if (lang === 'en' || lang === 'hi' || lang === 'ur' || lang === 'te' || lang === 'gu') {
            document.documentElement.lang = lang;
            document.documentElement.setAttribute('data-lang', lang);
            var isRtl = (lang === 'ur');
            document.documentElement.dir = isRtl ? 'rtl' : 'ltr';
            if (isRtl) {
              document.documentElement.classList.add('rtl');
            } else {
              document.documentElement.classList.remove('rtl');
            }
          }

          // Pre-render theme application to avoid FOUC
          var theme = localStorage.getItem('civicsaathi_theme') || localStorage.getItem('sevaguide_theme');
          var isDark = false;
          if (theme === 'dark') {
            isDark = true;
          } else if (theme === 'system' || !theme) {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }

          // Pre-render accessibility magnification
          var m = localStorage.getItem('civicsaathi_magnification') || localStorage.getItem('sevaguide_magnification');
          if (m) {
            var val = parseInt(m, 10);
            if (val >= 80 && val <= 150) {
              document.documentElement.style.fontSize = val + '%';
              document.documentElement.style.setProperty('--app-magnification', val + '%');
            }
          }

          // Pre-render color vision accessibility mode to prevent FOUC
          var cvMode = localStorage.getItem('civicsaathi_color_vision_mode') || localStorage.getItem('sevaguide_color_vision_mode');
          var legacyContrast = (localStorage.getItem('civicsaathi_high_contrast') || localStorage.getItem('sevaguide_high_contrast')) === 'true';
          if (!cvMode && legacyContrast) {
            cvMode = 'high-contrast';
          }
          if (cvMode && cvMode !== 'none' && cvMode !== 'default') {
            document.documentElement.setAttribute('data-vision-mode', cvMode);
            if (cvMode === 'protanopia') document.documentElement.classList.add('cb-protanopia');
            if (cvMode === 'deuteranopia') document.documentElement.classList.add('cb-deuteranopia');
            if (cvMode === 'tritanopia') document.documentElement.classList.add('cb-tritanopia');
            if (cvMode === 'high-contrast') {
              document.documentElement.classList.add('cb-high-contrast', 'high-contrast');
            }
          } else {
            document.documentElement.setAttribute('data-vision-mode', 'default');
          }

          if (((localStorage.getItem('civicsaathi_high_contrast') || localStorage.getItem('sevaguide_high_contrast')) === 'true') && !document.documentElement.classList.contains('high-contrast')) {
            document.documentElement.classList.add('high-contrast');
          }
          if ((localStorage.getItem('civicsaathi_reduced_motion') || localStorage.getItem('sevaguide_reduced_motion')) === 'true') {
            document.documentElement.classList.add('reduce-motion');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-black text-slate-900 dark:text-slate-100 transition-colors">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
